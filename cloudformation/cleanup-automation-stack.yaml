AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Resource Cleanup Automation with Step Functions and Lambda'

Parameters:
  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: Memory size for cleanup Lambda function (MB)
    MinValue: 128
    MaxValue: 10240
  
  LambdaTimeout:
    Type: Number
    Default: 900
    Description: Timeout for cleanup Lambda function (seconds)
    MinValue: 3
    MaxValue: 900
  
  RetryLambdaMemorySize:
    Type: Number
    Default: 128
    Description: Memory size for retry Lambda function (MB)
    MinValue: 128
    MaxValue: 3008
  
  RetryLambdaTimeout:
    Type: Number
    Default: 60
    Description: Timeout for retry Lambda function (seconds)
    MinValue: 3
    MaxValue: 900

  NotificationLambdaMemorySize:
    Type: Number
    Default: 128
    Description: Memory size for notification Lambda function (MB)
    MinValue: 128
    MaxValue: 3008

  NotificationLambdaTimeout:
    Type: Number
    Default: 60
    Description: Timeout for notification Lambda function (seconds)
    MinValue: 3
    MaxValue: 900
  
  MaxRetryAttempts:
    Type: Number
    Default: 5
    Description: Maximum number of retry attempts for cleanup
    MinValue: 1
    MaxValue: 10
  
  RetryDelaySeconds:
    Type: Number
    Default: 120
    Description: Delay between retry attempts (seconds)
    MinValue: 30
    MaxValue: 600
  
  EnableXRayTracing:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable X-Ray tracing for Step Functions and Lambda

  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages
  
  CleanupLambdaS3Key:
    Type: String
    Default: cleanup-lambda.zip
    Description: S3 key for cleanup Lambda deployment package
  
  RetryLambdaS3Key:
    Type: String
    Default: retry-lambda.zip
    Description: S3 key for retry Lambda deployment package

  NotificationLambdaS3Key:
    Type: String
    Default: notification-lambda.zip
    Description: S3 key for notification Lambda deployment package
  
  PyYAMLLayerS3Bucket:
    Type: String
    Description: S3 bucket containing PyYAML layer
  
  PyYAMLLayerS3Key:
    Type: String
    Default: pyyaml-layer.zip
    Description: S3 key for PyYAML layer package
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the cleanup Lambda function will be deployed
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Lambda function (use private subnets with NAT Gateway)
  
  AllowedCidrBlock:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR block allowed for inbound traffic to Lambda security group

  EnableScheduledExecution:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable EventBridge Scheduler to start cleanup on the second Friday at 6 PM Eastern Time

  ScheduleExpression:
    Type: String
    Default: 'cron(0 9 ? * WED#2 *)'
    Description: Schedule expression for EventBridge Scheduler (second Friday at 6 PM)

  ScheduleExpressionTimezone:
    Type: String
    Default: 'America/New_York'
    Description: IANA time zone for scheduled execution

  ScheduledRegionsJson:
    Type: String
    Default: '["us-gov-west-1"]'
    Description: JSON array of regions for scheduled execution payload

  ScheduledDryRun:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether scheduled execution runs in dry-run mode

  ScheduledExclusionsJson:
    Type: String
    Default: '{"s3":["prod-*","backup-*","cloudtrail-*"],"rds":["production-*"],"ec2":["i-prod*"],"lambda":["cleanup-automation-*"],"cloudformation":["cleanup-automation-*"]}'
    Description: JSON object of exclusion patterns for scheduled execution payload

  SmtpRelayHost:
    Type: String
    Default: test.com
    Description: SMTP relay host for prior intimation emails

  SmtpRelayPort:
    Type: Number
    Default: 425
    Description: SMTP relay port for prior intimation emails
    MinValue: 1
    MaxValue: 65535

  SmtpUseStartTLS:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable STARTTLS when connecting to SMTP relay

  SmtpUsername:
    Type: String
    Default: ''
    Description: Optional SMTP username for relay authentication

  SmtpPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional SMTP password for relay authentication

  NotificationMailFrom:
    Type: String
    Default: cleanup-automation@test.com
    Description: Sender email address used for prior intimation mails

  NotificationMailTo:
    Type: String
    Default: ops@test.com
    Description: Comma-separated list of recipient email addresses


Conditions:
  EnableXRay: !Equals [!Ref EnableXRayTracing, 'true']
  EnableSchedule: !Equals [!Ref EnableScheduledExecution, 'true']

Resources:
  # ========================================
  # Security Group for Cleanup Lambda
  # ========================================
  CleanupLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-ResourceCleanupSG'
      GroupDescription: Security group for Resource Cleanup Lambda function
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: !Ref AllowedCidrBlock
          Description: Allow all traffic from internal network
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ResourceCleanupSG'

  # ========================================
  # Lambda Execution Role for Cleanup Lambda
  # ========================================
  CleanupLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-CleanupLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws-us-gov:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws-us-gov:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws-us-gov:iam::aws:policy/AmazonDynamoDBFullAccess
      Policies:
        - PolicyName: CleanupListPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListAndDescribePermissions
                Effect: Allow
                Action:
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                  - dynamodb:ListTables
                  - ecr:DescribeRepositories
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListNodegroups
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:ListBucketVersions
                  - aoss:ListCollections
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeAddresses
                  - ec2:DescribeImages
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListServices
                  - elasticache:DescribeCacheClusters
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - memorydb:DescribeClusters
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBClusters
                  - rds:DescribeDBClusterSnapshots
                  - lambda:ListFunctions
                  - sns:ListTopics
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticbeanstalk:DescribeApplications
                  - opensearchserverless:ListCollections
                  - sts:GetCallerIdentity
                Resource: '*'
        
        - PolicyName: CleanupDeletePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyCloudTrailBucketDeletion
                Effect: Deny
                Action:
                  - s3:DeleteBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::cloudtrail-*'
              
              - Sid: AllowResourceDeletion
                Effect: Allow
                Action:
                  # S3
                  - s3:DeleteBucket
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  # RDS
                  - rds:DeleteDBCluster
                  - rds:DeleteDBInstance
                  - rds:DeleteDBClusterSnapshot
                  - rds:DeleteDBSnapshot
                  # EC2
                  - ec2:TerminateInstances
                  - ec2:DeleteVolume
                  - ec2:DeleteSnapshot
                  - ec2:ReleaseAddress
                  - ec2:DeregisterImage
                  # EKS
                  - eks:DeleteAddon
                  - eks:DeleteCluster
                  - eks:DeleteNodegroup
                  # ECS
                  - ecs:DeleteCluster
                  - ecs:DeleteService
                  - ecs:UpdateService
                  # ECR
                  - ecr:DeleteRepository
                  # Load Balancers
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DeleteTargetGroup
                  # ElastiCache
                  - elasticache:DeleteCacheCluster
                  - elasticache:DeleteReplicationGroup
                  - elasticache:DeleteServerlessCache
                  - elasticache:DeleteServerlessCacheSnapshot
                  - elasticache:DeleteSnapshot
                  - elasticache:DeleteUser
                  - elasticache:DeleteUserGroup
                  # MemoryDB
                  - memorydb:DeleteCluster
                  # DynamoDB
                  - dynamodb:DeleteItem
                  - dynamodb:DeleteTable
                  - dynamodb:DeleteTableReplica
                  - dynamodb:DeleteBackup
                  # Lambda
                  - lambda:DeleteFunction
                  # SNS/SQS
                  - sns:DeleteTopic
                  - sqs:DeleteQueue
                  # CloudFormation
                  - cloudformation:DeleteStack
                  # Elastic Beanstalk
                  - elasticbeanstalk:TerminateEnvironment
                  - elasticbeanstalk:DeleteApplication
                  # OpenSearch
                  - opensearchserverless:DeleteCollection
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-CleanupLambdaRole'

  # ========================================
  # Lambda Execution Role for Retry Lambda
  # ========================================
  RetryLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-RetryLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws-us-gov:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RetryLambdaRole'

  # ========================================
  # Lambda Execution Role for Notification Lambda
  # ========================================
  NotificationLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-NotificationLambdaRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws-us-gov:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws-us-gov:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-NotificationLambdaRole'

  # ========================================
  # Step Functions Execution Role
  # ========================================
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-StepFunctionsRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt NotificationLambdaFunction.Arn
                  - !Sub '${NotificationLambdaFunction.Arn}:*'
                  - !GetAtt CleanupLambdaFunction.Arn
                  - !Sub '${CleanupLambdaFunction.Arn}:*'
                  - !GetAtt RetryCheckpointLambda.Arn
                  - !Sub '${RetryCheckpointLambda.Arn}:*'
        
        - PolicyName: XRayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-StepFunctionsRole'

  # ========================================
  # Lambda Layer for PyYAML
  # ========================================
  PyYAMLLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-PyYAML'
      Description: PyYAML library for cleanup Lambda
      Content:
        S3Bucket: !Ref PyYAMLLayerS3Bucket
        S3Key: !Ref PyYAMLLayerS3Key
      CompatibleRuntimes:
        - python3.9
        - python3.10
        - python3.11
        - python3.12
        - python3.13
      CompatibleArchitectures:
        - x86_64
        - arm64

  # Note: You'll need to create parameters for S3 bucket/key or package the layer
  # For now, adding placeholder parameters in Metadata section

  # ========================================
  # Cleanup Lambda Function (Resource Cleanup Handler)
  # ========================================
  CleanupLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ResourceCleanupHandler'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt CleanupLambdaExecutionRole.Arn
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref CleanupLambdaS3Key
      Layers:
        - !Ref PyYAMLLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref CleanupLambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          LOG_LEVEL: INFO
      TracingConfig:
        Mode: !If [EnableXRay, Active, PassThrough]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ResourceCleanupHandler'

  # ========================================
  # Retry Checkpoint Lambda Function (Retry Decision Handler)
  # ========================================
  RetryCheckpointLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-RetryDecisionHandler'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt RetryLambdaExecutionRole.Arn
      Timeout: !Ref RetryLambdaTimeout
      MemorySize: !Ref RetryLambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref RetryLambdaS3Key
      TracingConfig:
        Mode: !If [EnableXRay, Active, PassThrough]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-RetryDecisionHandler'

  # ========================================
  # Notification Lambda Function (Prior Intimation Handler)
  # ========================================
  NotificationLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-PriorIntimationHandler'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt NotificationLambdaExecutionRole.Arn
      Timeout: !Ref NotificationLambdaTimeout
      MemorySize: !Ref NotificationLambdaMemorySize
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref NotificationLambdaS3Key
      VpcConfig:
        SecurityGroupIds:
          - !Ref CleanupLambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          SMTP_HOST: !Ref SmtpRelayHost
          SMTP_PORT: !Ref SmtpRelayPort
          SMTP_USE_STARTTLS: !Ref SmtpUseStartTLS
          SMTP_USERNAME: !Ref SmtpUsername
          SMTP_PASSWORD: !Ref SmtpPassword
          MAIL_FROM: !Ref NotificationMailFrom
          MAIL_TO: !Ref NotificationMailTo
      TracingConfig:
        Mode: !If [EnableXRay, Active, PassThrough]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PriorIntimationHandler'

  # ========================================
  # Step Functions State Machine
  # ========================================
  CleanupStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${AWS::StackName}-CleanupStateMachine'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: !If [EnableXRay, true, false]
      DefinitionString: !Sub |
        {
          "Comment": "Account Cleanup with Retry Checkpoint",
          "StartAt": "Init",
          "States": {
            "Init": {
              "Type": "Pass",
              "Result": {
                "attempt": 1,
                "maxAttempts": ${MaxRetryAttempts}
              },
              "ResultPath": "$.meta",
              "Next": "PreCleanupNotification"
            },
            "PreCleanupNotification": {
              "Type": "Task",
              "Resource": "${NotificationLambdaFunction.Arn}",
              "TimeoutSeconds": 120,
              "Parameters": {
                "input.$": "$.input",
                "attempt.$": "$.meta.attempt",
                "runId.$": "$$.Execution.Id"
              },
              "ResultPath": "$.notificationResult",
              "Retry": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "IntervalSeconds": 30,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.notificationError",
                  "Next": "NotificationFail"
                }
              ],
              "Next": "InvokeCleanup"
            },
            "InvokeCleanup": {
              "Type": "Task",
              "Resource": "${CleanupLambdaFunction.Arn}",
              "TimeoutSeconds": 900,
              "HeartbeatSeconds": 300,
              "Parameters": {
                "regions.$": "$.input.regions",
                "exclusions.$": "$.input.exclusions",
                "dry_run.$": "$.input.dryRun",
                "attempt.$": "$.meta.attempt",
                "runId.$": "$$.Execution.Id"
              },
              "ResultPath": "$.cleanupResult",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.error",
                  "Next": "RetryCheckpointFromError"
                }
              ],
              "Next": "AssessCleanupResult"
            },
            "AssessCleanupResult": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.cleanupResult.statusCode",
                  "NumericEquals": 200,
                  "Next": "Done"
                }
              ],
              "Default": "RetryCheckpointFromResult"
            },
            "RetryCheckpointFromError": {
              "Type": "Task",
              "Resource": "${RetryCheckpointLambda.Arn}",
              "Parameters": {
                "attempt.$": "$.meta.attempt",
                "maxAttempts.$": "$.meta.maxAttempts",
                "error.$": "$.error",
                "delaySecondsDefault": ${RetryDelaySeconds}
              },
              "ResultPath": "$.retryDecision",
              "Next": "RetryOrFail"
            },
            "RetryCheckpointFromResult": {
              "Type": "Task",
              "Resource": "${RetryCheckpointLambda.Arn}",
              "Parameters": {
                "attempt.$": "$.meta.attempt",
                "maxAttempts.$": "$.meta.maxAttempts",
                "cleanupResult.$": "$.cleanupResult",
                "delaySecondsDefault": ${RetryDelaySeconds}
              },
              "ResultPath": "$.retryDecision",
              "Next": "RetryOrFail"
            },
            "RetryOrFail": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.retryDecision.action",
                  "StringEquals": "RETRY",
                  "Next": "WaitBeforeRetry"
                }
              ],
              "Default": "HardFail"
            },
            "WaitBeforeRetry": {
              "Type": "Wait",
              "SecondsPath": "$.retryDecision.delaySeconds",
              "Next": "BumpAttempt"
            },
            "BumpAttempt": {
              "Type": "Pass",
              "Parameters": {
                "attempt.$": "States.MathAdd($.meta.attempt, 1)",
                "maxAttempts.$": "$.meta.maxAttempts"
              },
              "ResultPath": "$.meta",
              "Next": "InvokeCleanup"
            },
            "HardFail": {
              "Type": "Fail",
              "Error": "CleanupFailed",
              "Cause": "Retry checkpoint decided to stop. See lastCleanupResult/error."
            },
            "NotificationFail": {
              "Type": "Fail",
              "Error": "PriorNotificationFailed",
              "Cause": "Unable to send prior intimation mail."
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-CleanupStateMachine'

  # ========================================
  # EventBridge Scheduler (Second Friday 6 PM ET)
  # ========================================
  ScheduledExecutionRole:
    Type: AWS::IAM::Role
    Condition: EnableSchedule
    Properties:
      RoleName: !Sub '${AWS::StackName}-SchedulerRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachineExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Ref CleanupStateMachine
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-SchedulerRole'

  CleanupStateMachineSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: EnableSchedule
    Properties:
      Name: !Sub '${AWS::StackName}-SecondFriday6PMET'
      Description: Starts cleanup Step Functions execution on second Friday at 6 PM Eastern Time
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleExpressionTimezone
      State: ENABLED
      Target:
        Arn: !Ref CleanupStateMachine
        RoleArn: !GetAtt ScheduledExecutionRole.Arn
        Input: !Sub |
          {
            "input": {
              "regions": ${ScheduledRegionsJson},
              "dryRun": ${ScheduledDryRun},
              "exclusions": ${ScheduledExclusionsJson}
            }
          }

  # ========================================
  # CloudWatch Log Groups
  # ========================================
  CleanupLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ResourceCleanupHandler'
      RetentionInDays: 30

  RetryLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-RetryDecisionHandler'
      RetentionInDays: 30

  NotificationLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-PriorIntimationHandler'
      RetentionInDays: 30

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/states/${AWS::StackName}-CleanupStateMachine'
      RetentionInDays: 30

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: VPC Configuration (Required)
        Parameters:
          - VpcId
          - SubnetIds
          - AllowedCidrBlock
      - Label:
          default: Lambda Configuration
        Parameters:
          - LambdaMemorySize
          - LambdaTimeout
          - RetryLambdaMemorySize
          - RetryLambdaTimeout
          - NotificationLambdaMemorySize
          - NotificationLambdaTimeout
      - Label:
          default: Notification Configuration
        Parameters:
          - SmtpRelayHost
          - SmtpRelayPort
          - SmtpUseStartTLS
          - SmtpUsername
          - SmtpPassword
          - NotificationMailFrom
          - NotificationMailTo
      - Label:
          default: Retry Configuration
        Parameters:
          - MaxRetryAttempts
          - RetryDelaySeconds
      - Label:
          default: Monitoring Configuration
        Parameters:
          - EnableXRayTracing
      - Label:
          default: Scheduled Execution Configuration
        Parameters:
          - EnableScheduledExecution
          - ScheduleExpression
          - ScheduleExpressionTimezone
          - ScheduledRegionsJson
          - ScheduledDryRun
          - ScheduledExclusionsJson
      - Label:
          default: Deployment Configuration (Required)
        Parameters:
          - LambdaCodeS3Bucket
          - CleanupLambdaS3Key
          - RetryLambdaS3Key
          - NotificationLambdaS3Key
          - PyYAMLLayerS3Bucket
          - PyYAMLLayerS3Key

Outputs:
  CleanupLambdaArn:
    Description: ARN of the Cleanup Lambda function
    Value: !GetAtt CleanupLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CleanupLambdaArn'
  
  RetryLambdaArn:
    Description: ARN of the Retry Lambda function
    Value: !GetAtt RetryCheckpointLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RetryLambdaArn'

  NotificationLambdaArn:
    Description: ARN of the Notification Lambda function
    Value: !GetAtt NotificationLambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-NotificationLambdaArn'
  
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value: !GetAtt CleanupStateMachine.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'
  
  CleanupLambdaRoleArn:
    Description: ARN of the Cleanup Lambda execution role
    Value: !GetAtt CleanupLambdaExecutionRole.Arn
  
  StepFunctionsRoleArn:
    Description: ARN of the Step Functions execution role
    Value: !GetAtt StepFunctionsExecutionRole.Arn

  ScheduledExecutionName:
    Condition: EnableSchedule
    Description: Name of the EventBridge Scheduler schedule
    Value: !Ref CleanupStateMachineSchedule
